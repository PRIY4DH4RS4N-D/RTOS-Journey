<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15213b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="arduinoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2744"/>
    </linearGradient>

    <linearGradient id="espIdfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0f3d3a"/>
    </linearGradient>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <filter id="subtleDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="750" fill="url(#bgGrad)" />
  <rect width="1100" height="750" fill="url(#gridPattern)" />
  <rect x="15" y="15" width="1070" height="720" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <g transform="translate(45, 50)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">FRAMEWORK COMPARISON</text>
    <text x="0" y="30" font-family="'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Arduino-ESP32 vs Native ESP-IDF</text>
    <text x="0" y="52" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" fill="#94a3b8">Architectural differences and development approaches</text>
  </g>

  <g transform="translate(45, 130)" filter="url(#subtleDropShadow)">
    <rect x="0" y="0" width="1010" height="570" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="1010" height="28" rx="10" fill="#1e293b" fill-opacity="0.8"/>
    <rect x="0" y="18" width="1010" height="10" fill="#1e293b" fill-opacity="0.8"/>
    <text x="18" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">DEVELOPMENT FRAMEWORK ARCHITECTURE</text>

    <g transform="translate(25, 50)">
      <rect x="0" y="0" width="460" height="490" rx="8" fill="url(#arduinoGrad)" stroke="#3b82f6" stroke-width="2"/>
      <rect x="0" y="0" width="460" height="35" rx="8" fill="#1e40af" fill-opacity="0.5"/>
      <rect x="0" y="25" width="460" height="10" fill="#1e40af" fill-opacity="0.5"/>
      <text x="20" y="23" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#60a5fa">Arduino-ESP32 Framework</text>

      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="420" height="50" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
        <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">User Application Layer</text>
        <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">setup() / loop() / .ino sketch</text>
      </g>

      <path d="M 230 100 L 230 125" fill="none" stroke="#3b82f6" stroke-width="2"/>

      <g transform="translate(20, 125)">
        <rect x="0" y="0" width="420" height="50" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
        <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Arduino Core APIs</text>
        <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">digitalWrite() / Serial.println() / delay()</text>
      </g>

      <path d="M 230 175 L 230 200" fill="none" stroke="#3b82f6" stroke-width="2"/>

      <g transform="translate(20, 200)">
        <rect x="0" y="0" width="420" height="50" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
        <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Arduino ESP32 Core</text>
        <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Hardware abstraction layer</text>
      </g>

      <path d="M 230 250 L 230 275" fill="none" stroke="#3b82f6" stroke-width="2"/>

      <g transform="translate(20, 275)">
        <rect x="0" y="0" width="420" height="50" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
        <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">FreeRTOS Kernel</text>
        <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Hidden underneath Arduino core</text>
      </g>

      <path d="M 230 325 L 230 350" fill="none" stroke="#3b82f6" stroke-width="2"/>

      <g transform="translate(20, 350)">
        <rect x="0" y="0" width="420" height="50" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
        <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">ESP-IDF Components</text>
        <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Driver layer (GPIO, UART, WiFi, BT)</text>
      </g>

      <path d="M 230 400 L 230 425" fill="none" stroke="#3b82f6" stroke-width="2"/>

      <g transform="translate(20, 425)">
        <rect x="0" y="0" width="420" height="50" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
        <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">ESP32 Hardware</text>
        <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Xtensa LX6 dual-core SoC</text>
      </g>
    </g>

    <g transform="translate(525, 50)">
      <rect x="0" y="0" width="460" height="490" rx="8" fill="url(#espIdfGrad)" stroke="#14b8a6" stroke-width="2"/>
      <rect x="0" y="0" width="460" height="35" rx="8" fill="#0f766e" fill-opacity="0.5"/>
      <rect x="0" y="25" width="460" height="10" fill="#0f766e" fill-opacity="0.5"/>
      <text x="20" y="23" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#2dd4bf">Native ESP-IDF Framework</text>

      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="420" height="50" rx="5" fill="#0f172a" stroke="#14b8a6" stroke-width="1"/>
        <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">User Application Layer</text>
        <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">app_main() / C source files</text>
      </g>

      <path d="M 230 100 L 230 125" fill="none" stroke="#14b8a6" stroke-width="2"/>

      <g transform="translate(20, 125)">
        <rect x="0" y="0" width="420" height="50" rx="5" fill="#0f172a" stroke="#14b8a6" stroke-width="1"/>
        <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">FreeRTOS APIs</text>
        <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">xTaskCreate() / vTaskDelay() / Queues</text>
      </g>

      <path d="M 230 175 L 230 200" fill="none" stroke="#14b8a6" stroke-width="2"/>

      <g transform="translate(20, 200)">
        <rect x="0" y="0" width="420" height="50" rx="5" fill="#0f172a" stroke="#14b8a6" stroke-width="1"/>
        <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">ESP-IDF Drivers</text>
        <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">gpio_set_level() / ESP_LOGI() / driver/gpio</text>
      </g>

      <path d="M 230 250 L 230 275" fill="none" stroke="#14b8a6" stroke-width="2"/>

      <g transform="translate(20, 275)">
        <rect x="0" y="0" width="420" height="50" rx="5" fill="#0f172a" stroke="#14b8a6" stroke-width="1"/>
        <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">FreeRTOS Kernel</text>
        <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Direct access, full control</text>
      </g>

      <path d="M 230 325 L 230 350" fill="none" stroke="#14b8a6" stroke-width="2"/>

      <g transform="translate(20, 350)">
        <rect x="0" y="0" width="420" height="50" rx="5" fill="#0f172a" stroke="#14b8a6" stroke-width="1"/>
        <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">ESP-IDF Components</text>
        <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Component manager, build system</text>
      </g>

      <path d="M 230 400 L 230 425" fill="none" stroke="#14b8a6" stroke-width="2"/>

      <g transform="translate(20, 425)">
        <rect x="0" y="0" width="420" height="50" rx="5" fill="#0f172a" stroke="#14b8a6" stroke-width="1"/>
        <text x="15" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">ESP32 Hardware</text>
        <text x="15" y="38" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Xtensa LX6 dual-core SoC</text>
      </g>
    </g>
  </g>

  <text x="45" y="728" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569">RTOS-Journey | Arduino vs ESP-IDF Comparison | Experiment 02</text>
</svg>
