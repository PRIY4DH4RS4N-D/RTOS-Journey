<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15213b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cardGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162947"/>
      <stop offset="100%" stop-color="#0e1a30"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <!-- Glow & Shadow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#34d399"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#fb923c"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#818cf8"/>
    </marker>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1100" height="860" fill="url(#bgGrad)" />
  <rect width="1100" height="860" fill="url(#gridPattern)" />

  <!-- Outer Border Frame -->
  <rect x="15" y="15" width="1070" height="830" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- ==================== HEADER ==================== -->
  <g transform="translate(45, 50)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">SYSTEM ARCHITECTURE &amp; EXECUTION MODEL</text>
    <text x="0" y="30" font-family="'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">ESP32-WROOM FreeRTOS Firmware Architecture</text>
    <text x="0" y="52" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" fill="#94a3b8">Multi-layer execution, deterministic task scheduling, and state transitions for Experiment 01</text>
  </g>

  <!-- ==================== LAYER 1: APPLICATION LAYER ==================== -->
  <g transform="translate(45, 135)" filter="url(#subtleDropShadow)">
    <rect x="0" y="0" width="1010" height="150" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="1010" height="28" rx="10" fill="#1e293b" fill-opacity="0.8"/>
    <rect x="0" y="18" width="1010" height="10" fill="#1e293b" fill-opacity="0.8"/>
    <text x="18" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">LAYER 1: USER APPLICATION &amp; ARDUINO CORE TASKS</text>

    <!-- setup() / loopTask Card -->
    <rect x="25" y="42" width="460" height="92" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <rect x="35" y="52" width="8" height="8" rx="2" fill="#38bdf8"/>
    <text x="50" y="60" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Arduino Core Task: loopTask</text>
    <text x="50" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Priority: 1 | Stack: 8192 bytes | Core: 1</text>
    <text x="50" y="98" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">&#8226; <tspan font-family="'JetBrains Mono', monospace" fill="#38bdf8">setup()</tspan> initializes GPIO 2 &amp; invokes <tspan font-family="'JetBrains Mono', monospace" fill="#34d399">xTaskCreate()</tspan></text>
    <text x="50" y="118" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">&#8226; <tspan font-family="'JetBrains Mono', monospace" fill="#38bdf8">loop()</tspan> yields cpu: <tspan font-family="'JetBrains Mono', monospace" fill="#94a3b8">vTaskDelay(pdMS_TO_TICKS(1000))</tspan></text>

    <!-- LED_Task Card -->
    <rect x="525" y="42" width="460" height="92" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.4"/>
    <rect x="535" y="52" width="8" height="8" rx="2" fill="#34d399"/>
    <text x="550" y="60" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">User Created Task: LED_Task ("toggleLED")</text>
    <text x="550" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">Handle: ledTaskHandle | Priority: 1 | Stack: 2048 B</text>
    <text x="550" y="98" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">&#8226; Executes deterministic infinite loop: <tspan font-family="'JetBrains Mono', monospace" fill="#f1f5f9">while(true)</tspan></text>
    <text x="550" y="118" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">&#8226; Controls GPIO 2 &amp; invokes non-busy <tspan font-family="'JetBrains Mono', monospace" fill="#38bdf8">vTaskDelay(500ms)</tspan></text>
  </g>

  <!-- Connectors Layer 1 -> Layer 2 -->
  <path d="M 255 285 L 255 320" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowCyan)"/>
  <path d="M 755 285 L 755 320" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- ==================== LAYER 2: FREERTOS KERNEL & SCHEDULER ==================== -->
  <g transform="translate(45, 325)" filter="url(#subtleDropShadow)">
    <rect x="0" y="0" width="1010" height="235" rx="10" fill="url(#cardGradAccent)" stroke="#1e3a5f" stroke-width="1.5"/>
    <rect x="0" y="0" width="1010" height="28" rx="10" fill="#172554" fill-opacity="0.8"/>
    <rect x="0" y="18" width="1010" height="10" fill="#172554" fill-opacity="0.8"/>
    <text x="18" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">LAYER 2: FREERTOS KERNEL &amp; PREEMPTIVE SCHEDULER (ESP-IDF / Xtensa DUAL-CORE SMP)</text>

    <!-- State Transition Machine Inside FreeRTOS -->
    <g transform="translate(25, 42)">
      <rect x="0" y="0" width="960" height="175" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748b">TASK FINITE STATE MACHINE (FSM) &amp; SCHEDULER DISPATCHER</text>

      <!-- Ready State Box -->
      <rect x="50" y="55" width="170" height="85" rx="6" fill="#132238" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="135" y="85" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">READY</text>
      <text x="135" y="105" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">In Ready List [Prio 1]</text>
      <text x="135" y="122" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Awaiting CPU Time Slice</text>

      <!-- Arrow Ready -> Running -->
      <path d="M 220 85 L 380 85" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
      <text x="300" y="75" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Context Switched</text>
      <text x="300" y="102" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">(Scheduler Dispatch)</text>

      <!-- Running State Box -->
      <rect x="390" y="55" width="180" height="85" rx="6" fill="#063228" stroke="#34d399" stroke-width="1.8"/>
      <text x="480" y="85" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#34d399" text-anchor="middle">RUNNING</text>
      <text x="480" y="105" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">Executing on Core 1</text>
      <text x="480" y="122" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">Toggles GPIO / Calls Delay</text>

      <!-- Arrow Running -> Blocked -->
      <path d="M 570 85 L 730 85" fill="none" stroke="#fb923c" stroke-width="1.8" marker-end="url(#arrowOrange)"/>
      <text x="650" y="75" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fb923c" text-anchor="middle">vTaskDelay(500ms)</text>
      <text x="650" y="102" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle">Enters Delay List</text>

      <!-- Blocked State Box -->
      <rect x="740" y="55" width="170" height="85" rx="6" fill="#2d1a12" stroke="#fb923c" stroke-width="1.5"/>
      <text x="825" y="85" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#fb923c" text-anchor="middle">BLOCKED</text>
      <text x="825" y="105" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fdba74" text-anchor="middle">Suspended (0% CPU)</text>
      <text x="825" y="122" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fed7aa" text-anchor="middle">Tick Timer Counts Down</text>

      <!-- Return Arrow Blocked -> Ready -->
      <path d="M 825 140 L 825 160 L 135 160 L 135 140" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowBlue)"/>
      <text x="480" y="154" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a5b4fc" text-anchor="middle">Delay Expires (500ms Elapsed / SysTick Event) &#8594; Moved Back to Ready List</text>
    </g>
  </g>

  <!-- Connectors Layer 2 -> Layer 3 -->
  <path d="M 525 560 L 525 595" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- ==================== LAYER 3: HARDWARE / PERIPHERAL LAYER ==================== -->
  <g transform="translate(45, 600)" filter="url(#subtleDropShadow)">
    <rect x="0" y="0" width="1010" height="210" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="1010" height="28" rx="10" fill="#1e293b" fill-opacity="0.8"/>
    <rect x="0" y="18" width="1010" height="10" fill="#1e293b" fill-opacity="0.8"/>
    <text x="18" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">LAYER 3: ESP32-WROOM-32 HARDWARE &amp; PHYSICAL PERIPHERALS</text>

    <!-- SoC Silicon Spec Card -->
    <rect x="25" y="42" width="460" height="148" rx="6" fill="#090e1a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="45" y="68" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">ESP32 SoC (Xtensa Dual-Core 32-bit LX6 @ 240MHz)</text>
    
    <g transform="translate(45, 88)">
      <rect x="0" y="0" width="195" height="42" rx="4" fill="#15213b" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">CORE 0 (PRO_CPU)</text>
      <text x="12" y="32" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">WiFi / BLE / System Stack</text>

      <rect x="215" y="0" width="195" height="42" rx="4" fill="#132a28" stroke="#34d399" stroke-width="0.8"/>
      <text x="227" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399">CORE 1 (APP_CPU)</text>
      <text x="227" y="32" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Arduino Loop &amp; LED_Task</text>
    </g>

    <text x="45" y="152" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Internal SRAM: 520 KB | Flash: 4 MB SPI | SysTick: 1000 Hz (1ms tick)</text>
    <text x="45" y="172" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">&#8226; FreeRTOS tick interrupt triggers periodic preemption check every 1 ms</text>

    <!-- Peripherals Card: GPIO & Onboard LED -->
    <rect x="525" y="42" width="460" height="148" rx="6" fill="#090e1a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="545" y="68" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">GPIO Matrix &amp; Physical Actuation</text>

    <!-- GPIO 2 Register block -->
    <rect x="545" y="86" width="170" height="88" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="560" y="108" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">GPIO 2 (OUTPUT)</text>
    <text x="560" y="126" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">GPIO_OUT_W1TS_REG</text>
    <text x="560" y="142" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1">GPIO_OUT_W1TC_REG</text>
    <text x="560" y="160" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399">Logic High / Low</text>

    <!-- Wire connection to LED -->
    <path d="M 715 130 L 760 130" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <!-- Onboard LED Indicator -->
    <g transform="translate(770, 86)">
      <rect x="0" y="0" width="195" height="88" rx="6" fill="#0b172b" stroke="#38bdf8" stroke-width="1.2"/>
      
      <!-- Blue LED Graphic -->
      <circle cx="36" cy="44" r="16" fill="#0284c7" filter="url(#cyanGlow)" opacity="0.9"/>
      <circle cx="36" cy="44" r="10" fill="#38bdf8"/>
      <circle cx="33" cy="40" r="3" fill="#ffffff" opacity="0.8"/>

      <text x="64" y="36" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Blue SMD LED</text>
      <text x="64" y="54" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">Onboard D2</text>
      <text x="64" y="72" font-family="'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Blink: 1 Hz (50% duty)</text>
    </g>
  </g>

  <!-- Footer / Spec Tag -->
  <text x="45" y="838" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569">RTOS-Journey | ESP32-WROOM-32 Architecture Spec | FreeRTOS Kernel v10.x SMP | Arduino Core v2.x/v3.x</text>
</svg>
