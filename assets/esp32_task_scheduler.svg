<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15213b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cardGradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162947"/>
      <stop offset="100%" stop-color="#0e1a30"/>
    </linearGradient>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#34d399"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#fb923c"/>
    </marker>
  </defs>

  <rect width="1100" height="900" fill="url(#bgGrad)" />
  <rect width="1100" height="900" fill="url(#gridPattern)" />
  <rect x="15" y="15" width="1070" height="870" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <g transform="translate(45, 50)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">SYSTEM ARCHITECTURE</text>
    <text x="0" y="30" font-family="'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">Native ESP-IDF Multiple FreeRTOS Tasks</text>
    <text x="0" y="52" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" fill="#94a3b8">Dual-task execution with independent scheduling on ESP32-WROOM-32</text>
  </g>

  <g transform="translate(45, 135)" filter="url(#subtleDropShadow)">
    <rect x="0" y="0" width="1010" height="80" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="1010" height="28" rx="10" fill="#1e293b" fill-opacity="0.8"/>
    <rect x="0" y="18" width="1010" height="10" fill="#1e293b" fill-opacity="0.8"/>
    <text x="18" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">ESP-IDF FRAMEWORK LAYER</text>
    <text x="25" y="55" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Entry Point: <tspan font-family="'JetBrains Mono', monospace" fill="#38bdf8">app_main()</tspan> | Initializes FreeRTOS scheduler and creates tasks</text>
  </g>

  <path d="M 550 215 L 550 250" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <g transform="translate(45, 250)" filter="url(#subtleDropShadow)">
    <rect x="0" y="0" width="1010" height="100" rx="10" fill="url(#cardGradAccent)" stroke="#1e3a5f" stroke-width="1.5"/>
    <rect x="0" y="0" width="1010" height="28" rx="10" fill="#172554" fill-opacity="0.8"/>
    <rect x="0" y="18" width="1010" height="10" fill="#172554" fill-opacity="0.8"/>
    <text x="18" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">FREERTOS SCHEDULER</text>
    <text x="25" y="55" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">Preemptive priority-based scheduler manages task execution</text>
    <text x="25" y="78" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Tick Rate: 1000 Hz (1ms) | Dual-core SMP support</text>
  </g>

  <path d="M 255 350 L 255 385" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 755 350 L 755 385" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <g transform="translate(45, 385)" filter="url(#subtleDropShadow)">
    <rect x="0" y="0" width="1010" height="220" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="1010" height="28" rx="10" fill="#1e293b" fill-opacity="0.8"/>
    <rect x="0" y="18" width="1010" height="10" fill="#1e293b" fill-opacity="0.8"/>
    <text x="18" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">PARALLEL TASK EXECUTION</text>

    <rect x="25" y="42" width="460" height="160" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.4"/>
    <rect x="35" y="52" width="8" height="8" rx="2" fill="#34d399"/>
    <text x="50" y="60" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Task 1: LED_Task</text>
    <text x="50" y="80" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">Priority: 1 | Stack: 2048 bytes</text>
    
    <text x="50" y="105" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">1. Configure GPIO2 as output</text>
    <text x="50" y="125" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">2. Set LED ON</text>
    <text x="50" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">3. vTaskDelay(pdMS_TO_TICKS(500))</text>
    <text x="50" y="165" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">4. Set LED OFF</text>
    <text x="50" y="185" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">5. vTaskDelay(pdMS_TO_TICKS(500))</text>

    <rect x="525" y="42" width="460" height="160" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
    <rect x="535" y="52" width="8" height="8" rx="2" fill="#38bdf8"/>
    <text x="550" y="60" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Task 2: Monitor_Task</text>
    <text x="550" y="80" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">Priority: 1 | Stack: 2048 bytes</text>
    
    <text x="550" y="105" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">1. Print system status</text>
    <text x="550" y="125" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">2. ESP_LOGI("MONITOR", "ESP32 RTOS Running")</text>
    <text x="550" y="145" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">3. vTaskDelay(pdMS_TO_TICKS(1000))</text>
    <text x="550" y="165" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">4. Repeat indefinitely</text>
    <text x="550" y="185" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Independent of LED task timing</text>
  </g>

  <path d="M 255 605 L 255 640" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 755 605 L 755 640" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <g transform="translate(45, 640)" filter="url(#subtleDropShadow)">
    <rect x="0" y="0" width="1010" height="200" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="1010" height="28" rx="10" fill="#1e293b" fill-opacity="0.8"/>
    <rect x="0" y="18" width="1010" height="10" fill="#1e293b" fill-opacity="0.8"/>
    <text x="18" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">HARDWARE PERIPHERAL LAYER</text>

    <rect x="25" y="42" width="460" height="138" rx="6" fill="#090e1a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="45" y="68" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">GPIO 2 - Onboard LED</text>
    <text x="45" y="92" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">gpio_set_level(GPIO_NUM_2, 1/0)</text>
    <text x="45" y="112" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">Blue SMD LED toggles every 500ms</text>
    <text x="45" y="135" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Controlled by LED_Task via ESP-IDF GPIO driver</text>
    <text x="45" y="155" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Physical pin: GPIO2 | Logic: Active High</text>

    <rect x="525" y="42" width="460" height="138" rx="6" fill="#090e1a" stroke="#1e293b" stroke-width="1.2"/>
    <text x="545" y="68" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">UART Serial Output</text>
    <text x="545" y="92" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">ESP_LOGI(TAG, message)</text>
    <text x="545" y="112" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">Serial monitor at 115200 baud</text>
    <text x="545" y="135" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Both tasks output via ESP logging system</text>
    <text x="545" y="155" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Port: COM12 (development) | Baud: 115200</text>
  </g>

  <text x="45" y="878" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569">RTOS-Journey | Native ESP-IDF v6.1 | FreeRTOS SMP | Experiment 02</text>
</svg>
