<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15213b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <filter id="subtleDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#34d399"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#fb923c"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="url(#bgGrad)" />
  <rect width="1100" height="700" fill="url(#gridPattern)" />
  <rect x="15" y="15" width="1070" height="670" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <g transform="translate(45, 50)">
    <text x="0" y="0" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">TASK STATE MACHINE</text>
    <text x="0" y="30" font-family="'Segoe UI', -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">FreeRTOS Task Lifecycle</text>
    <text x="0" y="52" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" fill="#94a3b8">State transitions and scheduler behavior in FreeRTOS</text>
  </g>

  <g transform="translate(45, 130)" filter="url(#subtleDropShadow)">
    <rect x="0" y="0" width="1010" height="520" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="1010" height="28" rx="10" fill="#1e293b" fill-opacity="0.8"/>
    <rect x="0" y="18" width="1010" height="10" fill="#1e293b" fill-opacity="0.8"/>
    <text x="18" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">FREERTOS TASK FINITE STATE MACHINE (FSM)</text>

    <g transform="translate(50, 60)">
      <rect x="0" y="0" width="200" height="100" rx="8" fill="#132238" stroke="#38bdf8" stroke-width="2"/>
      <text x="100" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">READY</text>
      <text x="100" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">In Ready List</text>
      <text x="100" y="82" font-family="'Segoe UI', sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Awaiting CPU time</text>
    </g>

    <g transform="translate(350, 60)">
      <rect x="0" y="0" width="200" height="100" rx="8" fill="#063228" stroke="#34d399" stroke-width="2"/>
      <text x="100" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#34d399" text-anchor="middle">RUNNING</text>
      <text x="100" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a7f3d0" text-anchor="middle">Executing on Core</text>
      <text x="100" y="82" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">Active task</text>
    </g>

    <g transform="translate(650, 60)">
      <rect x="0" y="0" width="200" height="100" rx="8" fill="#2d1a12" stroke="#fb923c" stroke-width="2"/>
      <text x="100" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#fb923c" text-anchor="middle">BLOCKED</text>
      <text x="100" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fdba74" text-anchor="middle">Waiting (0% CPU)</text>
      <text x="100" y="82" font-family="'Segoe UI', sans-serif" font-size="10" fill="#fed7aa" text-anchor="middle">Delay / Event</text>
    </g>

    <g transform="translate(350, 300)">
      <rect x="0" y="0" width="200" height="100" rx="8" fill="#2e1a3d" stroke="#a78bfa" stroke-width="2"/>
      <text x="100" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#a78bfa" text-anchor="middle">SUSPENDED</text>
      <text x="100" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c4b5fd" text-anchor="middle">Paused</text>
      <text x="100" y="82" font-family="'Segoe UI', sans-serif" font-size="10" fill="#ddd6fe" text-anchor="middle">Manual control</text>
    </g>

    <path d="M 250 110 L 340 110" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="295" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Scheduler selects</text>

    <path d="M 550 110 L 640 110" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowOrange)"/>
    <text x="595" y="100" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fb923c" text-anchor="middle">vTaskDelay()</text>

    <path d="M 750 160 L 750 200 L 150 200 L 150 160" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowGreen)"/>
    <text x="450" y="190" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399" text-anchor="middle">Delay expires / Event occurs</text>

    <path d="M 450 160 L 450 290" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
    <text x="460" y="230" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a78bfa">vTaskSuspend()</text>

    <path d="M 350 350 L 250 350 L 250 170" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowPurple)"/>
    <text x="300" y="340" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a78bfa" text-anchor="middle">vTaskResume()</text>

    <path d="M 550 350 L 650 350 L 650 170" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowPurple)"/>
    <text x="600" y="340" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a78bfa" text-anchor="middle">vTaskResume()</text>

    <g transform="translate(50, 430)">
      <rect x="0" y="0" width="910" height="70" rx="6" fill="#090e1a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#64748b">TRANSITION TRIGGERS</text>
      <text x="20" y="45" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Ready → Running: Scheduler dispatches highest-priority ready task</text>
      <text x="20" y="62" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Running → Blocked: Task calls vTaskDelay() or waits on synchronization primitive</text>
      <text x="480" y="45" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Blocked → Ready: Delay timer expires or synchronization event occurs</text>
      <text x="480" y="62" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Running/Blocked/Suspended ↔ Suspended: Manual vTaskSuspend()/vTaskResume()</text>
    </g>
  </g>

  <text x="45" y="678" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569">RTOS-Journey | FreeRTOS Task State Machine | Experiment 02</text>
</svg>
